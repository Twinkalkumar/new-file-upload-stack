name: pipeline app cicd compose

on:
    workflow_dispatch:

jobs:
    auth:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code                   # checkout
              uses: actions/checkout@v4
            
            - name: Set up python                   # BUILD AND UNIT TEST
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - uses: ./.github/actions/action-python
              with:
                working-directory: auth
                python-packages: "pytest bandit mongomock"

    backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code                   # checkout
              uses: actions/checkout@v4
            
            - name: Set up python                   # BUILD AND UNIT TEST
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - uses: ./.github/actions/action-python
              with:
                working-directory: backend
                python-packages: "pytest bandit mongomock"
      
    lint-frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Lint HTML
              run: |
                npm install -g htmlhint
                htmlhint "frontend/*.html"
            - name: Validate nginx config syntax
              run: |
                docker run --rm \
                 --add-host=auth:127.0.0.1 \
                 --add-host=backend:127.0.0.1 \
                 -v ${{ github.workspace }}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx nginx -t